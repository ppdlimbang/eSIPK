name: eSIPK checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  application:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/build.py
      - run: python3 tools/test.py
      - run: python3 tools/test_render.py
      - run: python3 tools/test_accounts.py
      - run: python3 tests/test_school_import.py
      - run: git diff --exit-code -- esipk_dashboard.html
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: esipk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: ci-only-password
      PGDATABASE: esipk_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql_bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609100001_esipk.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609100002_school_accounts.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/202609100003_school_account_edit.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/rls.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/account_access.sql
